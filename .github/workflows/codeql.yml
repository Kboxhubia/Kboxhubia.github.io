# For most projects, this workflow file will not need changing; you simply need
# to commit it to your repository.
#
# This repository does not contain Python source files. To avoid CodeQL jobs
# failing when no Python sources are present, we limit the languages analyzed
# to those relevant (Actions and JavaScript/TypeScript) and only trigger the
# workflow when files that may affect those languages are changed.

name: "CodeQL Advanced"

on:
  push:
    branches: [ "main" ]
    paths:
      - '**/*.js'
      - '**/*.ts'
      - 'src/**'
      - 'lib/**'
      - 'package.json'
      - 'package-lock.json'
      - 'yarn.lock'
      - '.github/workflows/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - '**/*.js'
      - '**/*.ts'
      - 'src/**'
      - 'lib/**'
      - 'package.json'
      - 'package-lock.json'
      - 'yarn.lock'
      - '.github/workflows/**'
  schedule:
    - cron: '39 3 * * 1'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: actions
          build-mode: none
        - language: javascript-typescript
          build-mode: none

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    # Add any setup steps before running the `github/codeql-action/init` action.
    # This includes steps like installing compilers or runtimes (`actions/setup-node`
    # or others). This is typically only required for manual builds.

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}

    - name: Run manual build steps
      if: matrix.build-mode == 'manual'
      shell: bash
      run: |
        echo 'If you are using a "manual" build mode for one or more of the'
        echo 'languages you are analyzing, replace this with the commands to build'
        echo 'your code, for example:'
        echo '  make bootstrap'
        echo '  make release'
        exit 1

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{matrix.language}}"
